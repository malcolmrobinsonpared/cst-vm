# /etc/ssh/sshd_config.d/50-students.conf
# Rendered by scripts/40-ssh.sh. Drop-in overrides the shipped sshd_config.
# @PLACEHOLDERS@ come from config.env.

Port @SSH_PORT@

# Only these groups may log in. Everyone else is refused even with valid
# credentials.
AllowGroups @SSH_ALLOW_GROUPS@

# --- auth ---
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication @SSH_PASSWORD_AUTH@
KbdInteractiveAuthentication @SSH_PASSWORD_AUTH@
PermitEmptyPasswords no
MaxAuthTries 4
LoginGraceTime 30
# Auth is governed by the two toggles above: pubkey always works; password/
# keyboard-interactive (password via PAM) work only while PASSWORD_AUTH is "yes".

# --- this is a headless server: no GUI/X forwarding, no tunneling games ---
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no

# --- session hygiene / DoS resistance for a shared box ---
ClientAliveInterval 300
ClientAliveCountMax 2
MaxSessions 6
MaxStartups 15:30:60
LogLevel VERBOSE
PrintMotd no
AcceptEnv LANG LC_*

# Students land in a normal login shell (toolchains come from /etc/profile.d).
