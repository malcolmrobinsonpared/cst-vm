# /etc/security/limits.d/90-students.conf
# Rendered by scripts/20-cgroups.sh. Per-process/per-session ulimits enforced
# by PAM (pam_limits.so) — complements the cgroup slice caps.
#
#   <domain>      <type>  <item>   <value>
@@STUDENT_GROUP@   soft    nofile   @ULIMIT_NOFILE@
@@STUDENT_GROUP@   hard    nofile   @ULIMIT_NOFILE@
@@STUDENT_GROUP@   soft    nproc    @ULIMIT_NPROC@
@@STUDENT_GROUP@   hard    nproc    @ULIMIT_NPROC@
# No core dumps on a shared box (avoids filling /home with large dumps).
@@STUDENT_GROUP@   hard    core     0
